name: Generar video con Higgsfield

# Se ejecuta cuando se sube una escena nueva a escenas/pendientes/,
# o a mano desde la pestaña Actions (botón "Run workflow").
on:
  push:
    branches: [main]
    paths: ["escenas/pendientes/**", "episodios/pendientes/**"]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Descripción de la escena (vacío = procesar solo las pendientes)"
        required: false
        default: ""
      carpeta:
        description: "Carpeta de destino, p. ej. 2026-09/2026-09-29_005_tema (vacío = pruebas)"
        required: false
        default: ""
      archivo:
        description: "Nombre del video, p. ej. 005_ES.mp4"
        required: false
        default: ""
      duracion:
        description: "Duración en segundos"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: generar-video
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Traer lo último (evita repetir tareas ya hechas por otra ejecución)
        run: git pull --rebase origin main || true

      - name: Instalar ffmpeg y Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install -q pillow faster-whisper
          python3 -m pip uninstall -y -q opencv-python opencv-contrib-python opencv-python-headless || true
          python3 -m pip install -q --no-cache-dir --force-reinstall opencv-python-headless
          python3 -c "import cv2; cv2.CascadeClassifier; print('OpenCV', cv2.__version__)" || echo "OpenCV no disponible: textos en posición por defecto"

      - name: Crear escena desde el formulario (si se escribió un prompt)
        if: github.event_name == 'workflow_dispatch' && inputs.prompt != ''
        env:
          PROMPT: ${{ inputs.prompt }}
          CARPETA: ${{ inputs.carpeta }}
          ARCHIVO: ${{ inputs.archivo }}
          DURACION: ${{ inputs.duracion }}
        run: |
          python3 - <<'EOF'
          import json, os, time
          sello = time.strftime("%Y%m%d_%H%M%S")
          escena = {
              "carpeta": os.environ["CARPETA"] or "pruebas",
              "archivo": os.environ["ARCHIVO"] or f"hf_{sello}.mp4",
              "prompt": os.environ["PROMPT"],
              "duracion": int(os.environ["DURACION"] or 10),
          }
          os.makedirs("escenas/pendientes", exist_ok=True)
          json.dump(escena, open(f"escenas/pendientes/manual_{sello}.json", "w"), ensure_ascii=False, indent=2)
          EOF

      - name: Generar voces (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 sistema/voces.py

      - name: Saldo antes
        continue-on-error: true
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python3 sistema/saldo.py antes

      - name: Generar videos
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
        run: python3 sistema/generar_higgsfield.py

      - name: Montar episodios
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 sistema/montar_episodio.py

      - name: Saldo despues
        if: always()
        continue-on-error: true
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python3 sistema/saldo.py despues

      - name: Guardar videos en el repositorio
        if: always()
        run: |
          git config user.name "geohomes-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada que guardar."
            exit 0
          fi
          git commit -m "Video generado con Higgsfield"
          for intento in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            sleep 5
          done
          exit 1
